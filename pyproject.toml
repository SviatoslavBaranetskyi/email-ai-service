[project]
name = "email-ai-service"
version = "0.1.0"
description = "Kafka-based email processing service with AI classification and summarization"
authors = [{ name = "Sviatoslav Baranetskyi" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
"pydantic>=2.6",
"pydantic-settings>=2.2",
"langchain>=0.2",
"langchain-core>=0.2",
"langchain-community>=0.2",
"langchain-ollama>=0.1",
"langgraph>=0.1",
"openai>=1.30",
"aiokafka>=0.10",
"sqlalchemy>=2.0",
"asyncpg>=0.29",
"psycopg2-binary>=2.9",
"python-dotenv>=1.0"
]

[project.optional-dependencies]
dev = [
"pytest>=8.2",
"pytest-asyncio>=0.23",
"ruff>=0.5",
"black>=24.4",
"mypy>=1.10",
"types-python-dateutil",
]

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
".git",
"**pycache**",
"build",
"dist",
".venv",
]

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"B",
"UP",
]

ignore = [
"E501"  # line length handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

exclude = [
"tests/"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
packages = ["app"]
